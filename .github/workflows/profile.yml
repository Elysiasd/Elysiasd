name: Refresh profile assets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution calendars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACCOUNT: ${{ github.repository_owner }}
        run: bash scripts/fetch.sh

      - name: Render SVGs
        run: python3 scripts/gen_contrib.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-light.svg assets/contrib-dark.svg
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh contribution graph [skip ci]"
          git push
